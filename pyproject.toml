[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triad-foundation"
version = "0.1.0"
description = "Independent Triad research platform — Day 1 foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.2,<3", "pyarrow>=19,<24", "psycopg[binary]>=3.2,<4",
  "neo4j>=5.28,<7", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
triad = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
