<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Readiness</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}
header,main{max-width:960px;margin:0 auto;padding:12px 16px}
nav a{margin-right:14px;color:#0b4fa8}
nav a:focus,button:focus,input:focus,select:focus{outline:3px solid #f5a300;outline-offset:2px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;background:#fff;border:1px solid #cfd5dc;border-radius:6px;padding:12px}
label{display:block;font-weight:600}
input,select,button{width:100%;box-sizing:border-box;font:inherit;padding:6px;margin-top:4px}
button{background:#0b4fa8;color:#fff;border:0;border-radius:4px;cursor:pointer}
button[disabled]{background:#7a8594;cursor:not-allowed}
.wide{grid-column:1/-1}
.card{background:#fff;border:1px solid #cfd5dc;border-radius:6px;padding:10px 14px;margin:12px 0}
.card h2,.card h3{margin:.2em 0;font-size:1.05em}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid #444;font-weight:700;font-size:.85em}
.err{border-color:#a4001a;color:#a4001a}
dt{font-weight:600;margin-top:6px}
dd{margin:0 0 0 12px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<nav aria-label="Triad">
<a href="/triad">Product</a>
<a href="/triad/development">Development</a>
<a href="/triad/cycles">Cycles</a>
<a href="/triad/daily-debrief">Daily Debrief</a>
</nav>
<h1>Research Readiness</h1>
<p>Read-only check of whether recorded historical data can support a research request. Data readiness does not establish strategy edge. A recorded archive is not validated research input.</p>
</header>
<main>
<div id="notice" role="status" aria-live="polite" class="card">Loading Core catalog…</div>
<form id="form" aria-label="Readiness request">
<div><label for="source">Source</label><select id="source"></select></div>
<div><label for="dataset">Dataset</label><select id="dataset"></select></div>
<div><label for="mode">Mode</label><select id="mode"><option>REAL</option><option>FIXTURE</option></select></div>
<div><label for="universe">Universe</label><input id="universe" value="EXPLICIT" autocomplete="off"></div>
<div><label for="membership">Membership rule</label><select id="membership"><option>EXPLICIT_SYMBOLS</option><option>HISTORICAL_CONSTITUENTS</option></select></div>
<div><label for="symbols">Symbols (comma separated)</label><input id="symbols" autocomplete="off"></div>
<div><label for="start">Start (UTC ISO, inclusive)</label><input id="start" placeholder="2026-09-14T13:30:00+00:00"></div>
<div><label for="end">End (UTC ISO, exclusive)</label><input id="end" placeholder="2026-09-16T20:00:00+00:00"></div>
<div class="wide"><button type="button" id="evaluate" disabled>Evaluate readiness (read-only)</button></div>
</form>
<section id="dsinfo" class="card" aria-label="Selected dataset"></section>
<section id="result" aria-live="polite" aria-label="Evaluation result"></section>
</main>
<script src="/triad/assets/research-readiness.js"></script>
</body>
</html>
