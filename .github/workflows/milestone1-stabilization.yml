name: Milestone 1 Stabilization

on:
  push:
    branches:
      - codex/core-stabilize-m1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app tests tools
      - name: Lint changed stabilization surface
        run: >-
          ruff check app/trading_core/providers/transports.py app/trading_core/contracts.py
          app/trading_core/governance.py app/trading_core/git_tools.py
          app/products/triad/development.py app/products/triad/daily_development.py
          tests/test_provider_control.py tests/test_product_development.py tests/test_governance.py
      - name: Focused unit tests
        run: pytest -q tests/test_provider_control.py tests/test_product_development.py tests/test_governance.py
